# Mini app nativa di prova per la Live Activity del recupero (AltStore + Apple ID gratuito).
# Pubblica RecompTest.ipa e la sua sorgente AltStore nella Release "liveactivity-test" (non tocca l'app Recomp):
#   https://github.com/splancxs/splancxs.github.io/releases/download/liveactivity-test/altstore-test.json
# Se la compilazione fallisce, le ultime righe del registro finiscono nella Release "liveactivity-test-log"
# (leggibile senza accesso, a differenza dei registri di Actions).
name: Test Live Activity

on:
  push:
    branches: [main]
    paths:
      - 'app-test/**'
      - '.github/workflows/app-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Genera il progetto Xcode
        working-directory: app-test
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compila (senza firma)
        working-directory: app-test
        run: |
          set -o pipefail
          xcodebuild -project RecompTest.xcodeproj -target RecompTest -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -n 40
          test -d build/Release-iphoneos/RecompTest.app/PlugIns/RecompTestWidget.appex

      - name: Crea RecompTest.ipa e la sorgente
        env:
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          APP=app-test/build/Release-iphoneos/RecompTest.app
          for P in "$APP/Info.plist" "$APP/PlugIns/RecompTestWidget.appex/Info.plist"; do
            plutil -replace CFBundleShortVersionString -string "1.0.$BUILD" "$P"
            plutil -replace CFBundleVersion -string "$BUILD" "$P"
          done
          # firma provvisoria: prima l'estensione, poi l'app (AltStore poi rifirma con il tuo Apple ID)
          codesign --force --sign - "$APP/PlugIns/RecompTestWidget.appex"
          codesign --force --sign - "$APP"
          plutil -convert json -o info.json "$APP/Info.plist"
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry RecompTest.ipa Payload
          ls -lh RecompTest.ipa
          node - <<'EOF'
          const fs = require('fs');
          const build = process.env.BUILD, repo = process.env.REPO;
          const info = JSON.parse(fs.readFileSync('info.json', 'utf8'));
          const size = fs.statSync('RecompTest.ipa').size;
          const version = `1.0.${build}`, date = new Date().toISOString();
          const downloadURL = `https://github.com/${repo}/releases/download/liveactivity-test/RecompTest.ipa`;
          const iconURL = 'https://splancxs.github.io/assets/icons/icon-512.png';
          const source = {
            name: 'Recomp Test', identifier: 'io.github.splancxs.recomptest.source', iconURL, tintColor: '#C4F031',
            apps: [{
              name: 'Recomp Test', bundleIdentifier: info.CFBundleIdentifier, developerName: 'splancxs',
              localizedDescription: 'Mini app di prova per la Live Activity del recupero.', iconURL, tintColor: '#C4F031',
              versions: [{ version, buildVersion: String(build), date, downloadURL, size, minOSVersion: '16.2' }],
              version, versionDate: date, downloadURL, size,
              appPermissions: { entitlements: [], privacy: {} },
            }],
            news: [],
          };
          fs.writeFileSync('altstore-test.json', JSON.stringify(source, null, 2));
          fs.writeFileSync('notes.md', ['Mini app di prova della Live Activity · compilazione ' + build, '', 'Sorgente AltStore:',
            `https://github.com/${repo}/releases/download/liveactivity-test/altstore-test.json`].join('\n'));
          EOF
          cat notes.md

      - name: Pubblica la Release di test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete liveactivity-test-log --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release delete liveactivity-test --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create liveactivity-test RecompTest.ipa altstore-test.json --repo "${{ github.repository }}" \
            --title "Recomp Test (Live Activity)" --notes-file notes.md --prerelease --latest=false

      - name: Se fallisce, pubblica il registro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Compilazione fallita. Ultime righe utili:'; echo '```'; \
            (grep -E "error:|warning: .*deprecated|BUILD FAILED|\*\* " app-test/build.log 2>/dev/null | tail -n 60) || true; \
            echo '---'; tail -n 80 app-test/build.log 2>/dev/null || echo 'nessun registro'; echo '```'; } > log.md
          gh release delete liveactivity-test-log --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create liveactivity-test-log --repo "${{ github.repository }}" --title "Recomp Test · registro errori" \
            --notes-file log.md --prerelease --latest=false
