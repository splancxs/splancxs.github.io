# Compila l'app iPhone di Recomp su un Mac di GitHub e la pubblica per AltStore.
# - Recomp.ipa (non firmata: la firma la fa AltStore con il tuo Apple ID gratuito)
# - altstore-source.json: la "sorgente" AltStore da cui installare e ricevere gli aggiornamenti.
# Entrambi finiscono in una Release pubblica; l'indirizzo fisso della sorgente è:
#   https://github.com/splancxs/splancxs.github.io/releases/latest/download/altstore-source.json
# Si avvia da solo quando cambiano sito o progetto iOS; si può lanciare a mano da Actions → "App iPhone" → Run workflow.
name: App iPhone

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'app-ios/**'
      - '.github/workflows/app-iphone.yml'
  workflow_dispatch:

permissions:
  contents: write # serve per creare la Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepara il progetto iOS
        working-directory: app-ios
        run: |
          exec > >(tee -a ../prepare.log) 2>&1 # registro di questa fase, pubblicato se qualcosa va storto
          npm install --no-audit --no-fund
          rm -rf www ios
          mkdir -p www
          cp ../index.html ../manifest.webmanifest www/
          cp -R ../assets www/
          npx cap add ios
          node patch-ios.mjs
          # Live Activity del recupero: file nativi dell'app ed estensione RecompLive
          cp native/Shared/RestAttributes.swift native/App/*.swift ios/App/App/
          mkdir -p ios/App/RecompLive
          cp native/Shared/RestAttributes.swift native/RecompLive/* ios/App/RecompLive/
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          npx cap sync ios
          # dopo "cap sync": Capacitor copia nel suo Package.swift la versione iOS più alta del progetto,
          # e l'iOS 18 dell'estensione (serve per l'Apple Watch) non è accettato dal suo formato
          ruby add-live-activity.rb
          # i plugin di Recomp (RestActivity, NativeTabs) vanno nell'elenco che Capacitor legge all'avvio (come notifiche e vibrazione):
          # così l'app li trova in window.Capacitor.Plugins. "cap sync" riscrive il file, quindi si aggiungono dopo.
          node -e "const fs=require('fs'),f='ios/App/App/capacitor.config.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.packageClassList=[...new Set([...(c.packageClassList||[]),'RestActivityPlugin','NativeTabsPlugin'])];fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('Plugin registrati:',c.packageClassList.join(', '))"

      - name: Compila (senza firma)
        working-directory: app-ios/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../../build.log | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app/PlugIns/RecompLive.appex

      - name: Crea Recomp.ipa
        env:
          BUILD: ${{ github.run_number }}
        run: |
          APP=app-ios/ios/App/build/Build/Products/Release-iphoneos/App.app
          # versione = numero della compilazione, così AltStore riconosce gli aggiornamenti
          # (anche l'estensione della Live Activity deve avere la stessa versione dell'app)
          for P in "$APP/Info.plist" "$APP/PlugIns/RecompLive.appex/Info.plist"; do
            plutil -replace CFBundleShortVersionString -string "1.0.$BUILD" "$P"
            plutil -replace CFBundleVersion -string "$BUILD" "$P"
          done
          # firma provvisoria "ad-hoc": AltStore poi rifirma con il tuo Apple ID
          codesign --force --deep --sign - "$APP"
          codesign -d --entitlements :- "$APP" > entitlements.plist 2>/dev/null || true
          plutil -convert json -o entitlements.json entitlements.plist 2>/dev/null || echo '{}' > entitlements.json
          plutil -convert json -o info.json "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Recomp.ipa Payload
          ls -lh Recomp.ipa

      - name: Crea la sorgente AltStore
        env:
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const build = process.env.BUILD, repo = process.env.REPO;
          const ent = JSON.parse(fs.readFileSync('entitlements.json', 'utf8'));
          const info = JSON.parse(fs.readFileSync('info.json', 'utf8'));
          const entitlements = Object.keys(ent).filter((k) => !['application-identifier', 'com.apple.developer.team-identifier'].includes(k));
          const privacy = Object.fromEntries(Object.entries(info).filter(([k]) => k.endsWith('UsageDescription')));
          const size = fs.statSync('Recomp.ipa').size;
          const version = `1.0.${build}`;
          const date = new Date().toISOString();
          const downloadURL = `https://github.com/${repo}/releases/download/build-${build}/Recomp.ipa`;
          const iconURL = 'https://splancxs.github.io/assets/icons/icon-512.png';
          const desc = 'Piano alimentare al grammo, scheda Torso/Limbs, progressi e Live Activity del recupero.';
          const source = {
            name: 'Recomp', identifier: 'io.github.splancxs.recomp.source', subtitle: 'App personale di Recomp',
            iconURL, website: 'https://splancxs.github.io', tintColor: '#C4F031',
            apps: [{
              name: 'Recomp', bundleIdentifier: info.CFBundleIdentifier, developerName: 'splancxs',
              subtitle: 'Ricomposizione corporea', localizedDescription: desc, iconURL, tintColor: '#C4F031',
              versions: [{ version, buildVersion: String(build), date, downloadURL, size, minOSVersion: info.MinimumOSVersion || '15.0', localizedDescription: `Compilazione ${build}` }],
              version, versionDate: date, downloadURL, size,
              appPermissions: { entitlements, privacy },
            }],
            news: [],
          };
          fs.writeFileSync('altstore-source.json', JSON.stringify(source, null, 2));
          const notes = [
            `Compilazione ${build} · versione ${version}`,
            '', 'Sorgente AltStore (indirizzo fisso):',
            `https://github.com/${repo}/releases/latest/download/altstore-source.json`,
            '', 'Entitlement incorporati nell\'app:', '```json', JSON.stringify(ent, null, 2), '```',
            '', 'Permessi privacy:', '```json', JSON.stringify(privacy, null, 2), '```',
          ].join('\n');
          fs.writeFileSync('notes.md', notes);
          console.log(notes);
          EOF

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          # pulizia: le vecchie app di prova (HealthKit, Live Activity) non servono più
          gh release delete healthkit-test --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release delete liveactivity-test --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release delete build-log --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "build-$BUILD" Recomp.ipa altstore-source.json \
            --repo "${{ github.repository }}" --title "Recomp · compilazione $BUILD" \
            --notes-file notes.md --latest

      # i registri di Actions non si leggono senza accesso: in caso di errore le ultime righe vanno in una Release
      - name: Se fallisce, pubblica il registro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Compilazione fallita. Errori:'; echo '```'; (grep -E "error:|BUILD FAILED" app-ios/build.log 2>/dev/null | tail -n 60) || true; \
            echo '--- compilazione'; tail -n 80 app-ios/build.log 2>/dev/null || echo 'nessun registro';             echo '--- preparazione'; tail -n 60 prepare.log 2>/dev/null || echo 'nessun registro'; echo '```'; } > log.md
          gh release delete build-log --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create build-log --repo "${{ github.repository }}" --title "Recomp · registro errori" \
            --notes-file log.md --prerelease --latest=false

      - uses: actions/upload-artifact@v4
        with:
          name: Recomp-ipa
          path: Recomp.ipa
          retention-days: 30
